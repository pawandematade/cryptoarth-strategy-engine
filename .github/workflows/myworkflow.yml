name: Deploy CryptoArth Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "📁 Moving to project directory"
            cd /var/www/cryptoarth
            echo "📥 Pulling latest code..."
            git pull origin main
            echo "🔐 Ensuring restart script is executable"
            chmod +x scripts/restart_cryptoarth.sh
            echo "🚀 Restarting backend..."
            bash scripts/restart_cryptoarth.sh
