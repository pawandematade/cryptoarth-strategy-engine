name: Strategy Engine CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to CryptoArth Production Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script_stop: true
          script: |
            cd /var/www/cryptoarth
            git pull origin main
            source venv/bin/activate

            sudo pkill -9 -f "uvicorn app.main:app" || true

            nohup python -m uvicorn app.main:app \
              --host 0.0.0.0 \
              --port 8000 \
              > uvicorn.log 2>&1 &

            exit 0
