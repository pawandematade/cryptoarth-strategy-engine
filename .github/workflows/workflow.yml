

name: CryptoArth-Bankend-Release

on:
  push:
    branches:
      - main  # Change to your deployment branch if needed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build --no-cache -t sanketb81/cryptoarth-backend:latest .
          docker push sanketb81/cryptoarth-backend:latest

      - name: Build and Push Docker Image 1
        run: |
          docker build -t sanketb81/cryptoarth-cron:latest -f Dockerfile1 .
          docker push sanketb81/cryptoarth-cron:latest


      - name: Build and Push Docker Image 2
        run: |
          docker build -t sanketb81/cryptoarth-beat:latest -f Dockerfile2 .
          docker push sanketb81/cryptoarth-beat:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker pull sanketb81/cryptoarth-backend:latest
            docker stop django-container || true
            docker rm django-container || true
            
            docker run -d --name django-container -p 80:8000 sanketb81/cryptoarth-backend:latest


      - name: Deploy to Server1
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP1 }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker pull sanketb81/cryptoarth-cron:latest
            docker stop django-container || true
            docker rm django-container || true
            docker run -d --name django-container -p 7000:8000 sanketb81/cryptoarth-cron:latest


      - name: Deploy to Server2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP1 }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker pull sanketb81/cryptoarth-beat:latest
            docker stop cron || true
            docker rm cron || true
            docker run -d --name cron -p 9000:8000 sanketb81/cryptoarth-beat:latest


